```html
<!DOCTYPE html>
<html>
<head>
<title>Welcome</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

#bg-video{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    border:none;
    z-index:-2;
    pointer-events:none;
}

body::before{
    content:"";
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.45);
    z-index:-1;
}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:black;
}

.box{
    width:350px;
    padding:30px;
    background:rgba(30,30,30,0.85);
    backdrop-filter:blur(12px);
    border-radius:20px;
    text-align:center;
    animation:pop 0.8s ease;
    box-shadow:0 0 30px rgba(255,255,255,0.15);
}

@keyframes pop{
    from{
        opacity:0;
        transform:scale(0.7);
    }
    to{
        opacity:1;
        transform:scale(1);
    }
}

h1{
    color:white;
    margin-bottom:20px;
}

input{
    width:100%;
    padding:12px;
    margin:8px 0;
    border:none;
    border-radius:10px;
    background:#333;
    color:white;
}

button{
    width:100%;
    padding:12px;
    margin-top:10px;
    border:none;
    border-radius:10px;
    background:#4CAF50;
    color:white;
    cursor:pointer;
    transition:0.3s;
}

button:hover{
    transform:scale(1.05);
}

#createBtn{
    background:#2196F3;
}

#welcome{
    display:none;
    color:white;
    font-size:28px;
    animation:slide 1s ease;
}

@keyframes slide{
    from{
        opacity:0;
        transform:translateY(-30px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}
</style>
</head>

<body>

<iframe
src="https://www.youtube.com/embed/jfKfPfyJRdk?autoplay=1&mute=1&controls=0&loop=1&playlist=jfKfPfyJRdk"
id="bg-video"
allow="autoplay">
</iframe>

<div class="box">

<div id="loginBox">
<h1>Welcome</h1>

<input type="text" id="username" placeholder="Username">
<input type="password" id="password" placeholder="Password">

<button id="createBtn" onclick="createAccount()">Create Account</button>
<button onclick="login()">Login</button>
</div>

<div id="welcome"></div>

</div>

<script>
function createAccount(){
    let user=document.getElementById("username").value;
    let pass=document.getElementById("password").value;

    localStorage.setItem("user",user);
    localStorage.setItem("pass",pass);

    alert("Account Created!");
}

function login(){
    let user=document.getElementById("username").value;
    let pass=document.getElementById("password").value;

    if(
        user===localStorage.getItem("user") &&
        pass===localStorage.getItem("pass")
    ){
        document.getElementById("loginBox").style.display="none";

        document.getElementById("welcome").style.display="block";
        document.getElementById("welcome").innerHTML =
        "Welcome " + user + " 👋";
    }
    else{
        alert("Wrong Username or Password");
    }
}
</script>

</body>
</html>
```
